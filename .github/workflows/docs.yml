# Strict docs build on every PR, same as Read the Docs (fail_on_warning).
# Copied from jilavsky-docs/templates/package-docs. Identical in every package.
name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # Same install as .readthedocs.yaml: docs pins, then the package without extras.
      - run: pip install -r docs/requirements.txt
      - run: pip install .
      - name: Build (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
